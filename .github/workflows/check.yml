name: Check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm install --no-save @capacitor-community/text-to-speech@6.1.0 @capacitor-community/speech-recognition@7.0.1 @capacitor/core@7
      - run: npm test
      - run: npx --yes tsx@4.20.6 src/engine/design-intent.test.ts
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
