name: Deploy Kuro-chan website
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Build Kuro-chan APK"]
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Put the latest APK on the website too
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --repo ${{ github.repository }} --pattern app-debug.apk --output dist/Kuro-chan.apk || echo "No APK yet"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
