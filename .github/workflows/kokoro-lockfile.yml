name: Generate Kokoro lockfile artifact
on:
  push:
    branches: [chore/kokoro-lockfile]
permissions:
  contents: read
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Resolve Kokoro TTS dependency and lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund kokoro-js@1.2.1
      - uses: actions/upload-artifact@v4
        with:
          name: kokoro-lockfile
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
