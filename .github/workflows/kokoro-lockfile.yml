name: Generate Kokoro lockfile artifact
on:
  push:
    branches: [chore/kokoro-lockfile]
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Resolve Kokoro TTS dependency and lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund kokoro-js@1.2.1
      - name: Commit generated dependency lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile is already up to date."
            exit 0
          fi
          git commit -m "chore: lock Kokoro TTS dependency"
          git push origin HEAD:chore/kokoro-lockfile
      - uses: actions/upload-artifact@v4
        with:
          name: kokoro-lockfile
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
