name: Build Kuro-chan APK
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor-community/text-to-speech@6.1.0 @capacitor-community/speech-recognition@7.0.1 @capacitor/assets
      - name: Build web app
        run: npm run build
        env:
          VITE_GITHUB_APP_CLIENT_ID: ${{ vars.VITE_GITHUB_APP_CLIENT_ID }}
      - run: npx cap add android
      - name: Generate Android launcher icons from approved Kuro-chan artwork
        run: |
          mkdir -p assets
          cp public/icon-512.png assets/icon.png
          npx capacitor-assets generate --android
      - name: Allow microphone (voice typing)
        run: |
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />#' android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Name the distributable APK
        id: check_apk
        run: |
          source_apk="android/app/build/outputs/apk/debug/app-debug.apk"
          distributable_apk="Kurochan.apk"
          if [ -f "$source_apk" ]; then
            cp "$source_apk" "$distributable_apk"
            test -s "$distributable_apk"
            echo "apk_exists=true" >> "$GITHUB_OUTPUT"
            echo "apk_name=$distributable_apk" >> "$GITHUB_OUTPUT"
          else
            echo "APK file not found: $source_apk"
            exit 1
          fi
      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.check_apk.outputs.apk_exists == 'true'
        with:
          tag_name: build-${{ github.run_number }}
          name: Kuro-chan Android build ${{ github.run_number }}
          body: |
            Install **Kurochan.apk** on your Android phone. Android may ask you to allow installs from this source.

            This is a CI-built debug APK, not a Play Store-signed production release.
          files: Kurochan.apk
          make_latest: true
