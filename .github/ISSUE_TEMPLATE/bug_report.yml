name: Bug report
description: Report a reproducible problem in Kuro-chan
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Please do not include API keys, access tokens, private source code, or personal data."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
      placeholder: I expected…
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open… 2. Click… 3. See error…"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Chat / agents
        - Preview / generated code
        - GitHub import / publish
        - Models / provider keys
        - Android / install
        - Mobile UI
        - Other
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Chrome on Android 11
  - type: textarea
    id: logs
    attributes:
      label: Error message or logs
      description: Remove secrets and private data before posting.
